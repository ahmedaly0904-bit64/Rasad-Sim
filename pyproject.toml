[project]
name = "rasad-sim"
version = "0.2.1"
description = "Measure how much of a stochastic simulation's result is a property of the model and how much is the random seed."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ahmed Aly" }]
keywords = [
    "simulation",
    "reproducibility",
    "agent-based-modeling",
    "uncertainty-quantification",
    "monte-carlo",
    "sensitivity-analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "plotly>=5.9"]

[project.urls]
Homepage = "https://github.com/ahmedaly0904-bit64/rasad"
Source = "https://github.com/ahmedaly0904-bit64/rasad"
Issues = "https://github.com/ahmedaly0904-bit64/rasad/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
examples = ["mesa>=3.5", "networkx>=3.0", "pandas>=2.0", "simpy>=4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rasad = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# S, I, R is the standard notation of compartmental epidemic models.
# Renaming them to satisfy a linter would make the code harder to read,
# not easier — the whole point of the notation is that readers know it.
"examples/*" = ["E741"]
